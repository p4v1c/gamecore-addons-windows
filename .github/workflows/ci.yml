name: CI

# Every pull request and every push to main, on the OS the addons run on.
# A suite is never added with continue-on-error: a red step means red.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    # UTF-8 mode, as addon-run.py starts every server (addon.env).
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 3.12 is the Python the GameCore installer ships; the CLI copies it for the addons.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # .gitattributes forces LF: the hooks and web files run as they are in the repo.
      - name: Checkout is LF
        shell: bash
        run: |
          if git ls-files --eol | grep -v '\.\(cmd\|bat\)$' | grep -q 'w/crlf'; then
            git ls-files --eol | grep 'w/crlf' | grep -v '\.\(cmd\|bat\)$'
            echo "::error::CRLF in the working tree, check .gitattributes"
            exit 1
          fi

      - name: Install the addons' dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.16.1' pytest $(cat addons/*/requirements.txt | sort -u)

      - name: Lint - Python (ruff)
        run: ruff check .

      # The hooks run on Windows PowerShell 5.1, the one every PC has.
      - name: Lint - PowerShell (PSScriptAnalyzer)
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          }
          $found = @('shared', 'addons') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings PSScriptAnalyzerSettings.psd1
          }
          $found | Format-Table -AutoSize RuleName, ScriptName, Line, Message | Out-String -Width 300
          if ($found) { exit 1 }

      - name: Every module compiles
        run: python -W error -m compileall -q addons shared scripts tests

      - name: Shared hooks, launcher and manifests
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Every addon's tests
        run: python scripts/run-tests.py
